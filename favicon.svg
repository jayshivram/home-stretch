<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Eight rays instead of the page sprite's thirteen: at 16px the finer
       petals collapse into a smear, so the tab icon is drawn coarser. -->
  <g stroke="#FFB21D" stroke-width="3.2" stroke-linecap="round">
    <line x1="16" y1="5"    x2="16" y2="2"/>
    <line x1="23.8" y1="8.2" x2="25.9" y2="6.1"/>
    <line x1="27" y1="16"    x2="30" y2="16"/>
    <line x1="23.8" y1="23.8" x2="25.9" y2="25.9"/>
    <line x1="16" y1="27"    x2="16" y2="30"/>
    <line x1="8.2" y1="23.8" x2="6.1" y2="25.9"/>
    <line x1="5" y1="16"     x2="2" y2="16"/>
    <line x1="8.2" y1="8.2"  x2="6.1" y2="6.1"/>
  </g>
  <circle cx="16" cy="16" r="8" fill="#FFB21D"/>
  <circle cx="16" cy="16" r="6.6" fill="#FFD91F"/>
</svg>
